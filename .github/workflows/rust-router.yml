name: Rust Router

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: rust-router-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-router:
    name: standalone router qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    defaults:
      run:
        shell: bash
        working-directory: sglang-omni-router

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned release and MSRV toolchains
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy,rustfmt \
            --no-self-update
          rustup toolchain install 1.90.0 \
            --profile minimal \
            --no-self-update
          rustc --version --verbose
          cargo --version --verbose
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo +1.90.0 --version --verbose
          rustc +1.90.0 --version | grep -E '^rustc 1\.90\.0 '

      - name: Install cargo-deny 0.20.2
        timeout-minutes: 3
        run: |
          set -euo pipefail

          version="0.20.2"
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 5 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"

          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $archive" \
            | sha256sum --check --strict

          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --strip-components=1 \
            --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cargo-deny" --version

      - name: Dependency and quality gates
        timeout-minutes: 20
        run: |
          set -euo pipefail

          cargo fmt --all -- --check
          cargo deny --locked check
          cargo +1.90.0 check --workspace --all-targets --all-features --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo build --workspace --all-targets --all-features --locked
          cargo test --workspace --all-targets --all-features --locked
          RUSTDOCFLAGS="-D warnings" \
            cargo doc --workspace --all-features --no-deps --locked
          cargo bench --locked --no-run
          cargo tree --locked -d
          cargo tree --locked --target all -d

      - name: Release qualification
        timeout-minutes: 10
        run: |
          set -euo pipefail

          cargo test --release --workspace --all-features --locked --test process
          cargo build --release --locked --bin sgl-omni-router

      - name: CLI smoke tests
        timeout-minutes: 3
        run: |
          set -euo pipefail

          binary="./target/release/sgl-omni-router"
          config="$RUNNER_TEMP/sgl-omni-router.toml"

          "$binary" --help
          "$binary" --version

          cat > "$config" <<'EOF'
          schema_version = 1

          [server]
          listen = "127.0.0.1:30000"

          [shutdown]
          drain_timeout_ms = 30000

          [logging]
          format = "json"
          filter = "info"

          [router]
          required_services = ["generation_http"]

          [admission]
          global = 8
          generation_http = 4
          speech_http = 1
          transcription_http = 1
          speech_batch = 1
          speech_websocket = 1
          realtime_websocket = 1
          control = 1

          [health]
          interval_ms = 100
          timeout_ms = 50
          success_threshold = 2
          failure_threshold = 3
          max_concurrent_probes = 2

          [http_generation]
          trust_domain = "local"
          buffered_request_max_bytes = 8388608
          buffered_request_total_bytes = 268435456
          streamed_request_max_bytes = 536870912
          connect_timeout_ms = 5000
          request_timeout_ms = 1800000
          pool_idle_timeout_ms = 90000
          pool_max_idle_per_host = 8

          [[workers]]
          worker_id = "worker-1"
          base_url = "http://127.0.0.1:9"
          trust_domain = "local"
          default_model_id = "omni"

          [workers.capacity]
          generation_http = 4

          [[workers.service_profiles]]
          service = "generation_http"
          model_ids = ["omni"]
          message_content_forms = ["string"]
          media_placements = []
          input_modalities = ["text"]
          output_modalities = ["text"]
          chat_audio_formats = []
          stream_modes = ["non_streaming", "streaming"]
          EOF

          "$binary" --config "$config" --check-config

      - name: Record release identity
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          rustc_version="$(rustc --version)"
          host_target="$(rustc --version --verbose | sed -n 's/^host: //p')"
          lock_sha256="$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
          binary_sha256="$(sha256sum target/release/sgl-omni-router | cut -d ' ' -f 1)"

          test -n "$commit"
          test -n "$tree"
          test -n "$rustc_version"
          test -n "$host_target"
          test -n "$lock_sha256"
          test -n "$binary_sha256"

          {
            echo "## Standalone router release identity"
            echo
            echo "| Field | Exact value |"
            echo "| --- | --- |"
            printf '| Git commit | `%s` |\n' "$commit"
            printf '| Git tree | `%s` |\n' "$tree"
            printf '| Rust compiler | `%s` |\n' "$rustc_version"
            printf '| Host target | `%s` |\n' "$host_target"
            printf '| Cargo.lock SHA-256 | `%s` |\n' "$lock_sha256"
            printf '| Release binary SHA-256 | `%s` |\n' "$binary_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify clean generated state
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
