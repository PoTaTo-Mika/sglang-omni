name: TTS CI

on:
  workflow_call:
    inputs:
      tts_ci_model:
        type: string
        default: higgs
      omni_ci_home:
        description: PR-scoped CI home from the parent omni-ci workflow.
        type: string
        required: false
        default: ""
      tts_stage1_topology:
        description: Explicit Stage 1 topology selected by CPU preflight.
        type: string
        required: false
        default: multi_gpu
      tts_stage1_mps_config:
        description: Validated production launch.sh config selected by CPU preflight.
        type: string
        required: true

env:
  OMNI_CI_HOME: >-
    ${{ inputs.omni_ci_home != ''
        && inputs.omni_ci_home
        || format('/data/omni-ci/run-{0}', github.run_id) }}

# Invoked by omni-ci.yaml after ASR CI. Restores omni only.
# DAG:
#   stage-1-non-streaming -> stage-2-streaming -> stage-3-consistency
#     -> stage-4-serving

jobs:
  stage-1-non-streaming:
    name: stage 1 - non-streaming
    runs-on: [self-hosted, h100]
    timeout-minutes: 25
    container:
      image: crpi-n6adu6llixz83q37.cn-hangzhou.personal.cr.aliyuncs.com/hongccc/sglang-omni:dev
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Prepare Stage 1 lifecycle
        shell: bash
        env:
          TTS_STAGE1_AUDIT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/stage1-audit/attempt-${{ github.run_attempt }}
        run: |
          source omni/bin/activate
          mkdir -p "${TTS_STAGE1_AUDIT_ROOT}"
          python .github/scripts/tts_stage1_artifacts.py initialize \
            --output-dir "${TTS_STAGE1_AUDIT_ROOT}" \
            --topology "${{ inputs.tts_stage1_topology }}"
          python .github/scripts/tts_stage1_lifecycle.py initialize \
            --output-dir "${TTS_STAGE1_AUDIT_ROOT}" \
            --topology "${{ inputs.tts_stage1_topology }}" \
            --model "${{ inputs.tts_ci_model }}"
      - name: Prepare explicit MPS Stage 1 runtime
        if: ${{ inputs.tts_stage1_topology == 'mps_shared' }}
        shell: bash
        env:
          TTS_STAGE1_AUDIT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/stage1-audit/attempt-${{ github.run_attempt }}
        run: |
          source omni/bin/activate
          test -f examples/mps_dp/launch.sh

          core_blocks=$(python .github/scripts/tts_stage1_mps_runtime.py \
            derive-core-blocks --gpu-id 0)
          echo "TTS_STAGE1_MPS_CORE_BLOCKS=${core_blocks}" >> "${GITHUB_ENV}"
          echo "TTS_STAGE1_MPS_RUN_ID=run-tts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Prepare speaker similarity assets
        shell: bash
        run: |
          source omni/bin/activate
          python -m benchmarks.metrics.speaker_similarity_assets --warm-cache
        env:
          HF_ENDPOINT: https://huggingface.co
          SEEDTTS_SIM_CACHE_DIR: /github/home/seedtts-wavlm-sim

      - name: Run TTS non-streaming benchmark stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_ci.py -v -s -x --concurrency 16 --tts-stage tts-stage-1-nonstream
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEEDTTS_SIM_CACHE_DIR: /github/home/seedtts-wavlm-sim
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream
          TTS_STAGE1_TOPOLOGY: ${{ inputs.tts_stage1_topology }}
          TTS_STAGE1_MPS_CONFIG: ${{ inputs.tts_stage1_mps_config }}
          TTS_STAGE1_AUDIT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/stage1-audit/attempt-${{ github.run_attempt }}
          TTS_STAGE1_MPS_STATE_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage1-mps-state
          TTS_STAGE1_MPS_GPU_ID: "0"
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Finalize Stage 1 lane verdict
        if: ${{ always() }}
        shell: bash
        env:
          TTS_STAGE1_AUDIT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/stage1-audit/attempt-${{ github.run_attempt }}
        run: |
          source omni/bin/activate
          python .github/scripts/tts_stage1_lifecycle.py finalize \
            --output-dir "${TTS_STAGE1_AUDIT_ROOT}" \
            --topology "${{ inputs.tts_stage1_topology }}" \
            --model "${{ inputs.tts_ci_model }}" \
            --exact-sha "${GITHUB_SHA}"

      - name: Upload Stage 1 lifecycle audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage1-audit-${{ inputs.tts_ci_model }}-${{ inputs.tts_stage1_topology }}-attempt-${{ github.run_attempt }}
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/stage1-audit/attempt-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload non-streaming speed artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage-nonstream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream/**/speed_results.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 1 (non-streaming)
          artifact-search-root: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream
          artifact-path-globs: |
            */speed_results.json
            */wer_results.json
            */similarity_results.json

  stage-2-streaming:
    name: stage 2 - streaming
    needs: stage-1-non-streaming
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 25
    container:
      image: crpi-n6adu6llixz83q37.cn-hangzhou.personal.cr.aliyuncs.com/hongccc/sglang-omni:dev
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run TTS streaming benchmark stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_ci.py -v -s -x --concurrency 16 --tts-stage tts-stage-2-stream
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Upload streaming speed artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-stage-stream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream/**/speed_results.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 2 (streaming)
          artifact-search-root: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream
          artifact-path-globs: |
            */speed_results.json
            */wer_results.json

  stage-3-consistency:
    name: stage 3 - consistency
    needs: stage-2-streaming
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 5
    container:
      image: crpi-n6adu6llixz83q37.cn-hangzhou.personal.cr.aliyuncs.com/hongccc/sglang-omni:dev
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Download non-streaming speed artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-stage-nonstream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream

      - name: Download streaming speed artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-stage-stream-speed-results
          path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream

      - name: Run consistency check
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_consistency_artifacts.py -v -s -x
        env:
          TTS_CI_MODEL: ${{ inputs.tts_ci_model }}
          TTS_STAGE1_SPEED_RESULTS_DIR: ${{ env.OMNI_CI_HOME }}/tts-stage-results/nonstream
          TTS_STAGE2_SPEED_RESULTS_DIR: ${{ env.OMNI_CI_HOME }}/tts-stage-results/stream
          TTS_CONSISTENCY_CONCURRENCY: "16"

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 3 (consistency)

  stage-4-serving:
    name: stage 4 - serving stress
    needs: stage-3-consistency
    if: always() && !cancelled()
    runs-on: [self-hosted, h100]
    timeout-minutes: 75
    container:
      image: crpi-n6adu6llixz83q37.cn-hangzhou.personal.cr.aliyuncs.com/hongccc/sglang-omni:dev
      options: >-
        --rm
        -e NVIDIA_VISIBLE_DEVICES
        -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni

      - name: Run TTS serving stress stage
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          bash .github/scripts/run_flaky_pytest.sh \
            pytest tests/test_model/test_tts_serving_ci.py -v -s -x
        env:
          HF_ENDPOINT: https://huggingface.co
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TTS_SERVING_STAGE_OUTPUT_ROOT: ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving
          TORCHINDUCTOR_CACHE_DIR: ${{ env.OMNI_CI_HOME }}/.torchinductor

      - name: Post-stage cleanup
        if: always()
        uses: ./.github/actions/omni-post-stage
        with:
          stage-label: TTS stage 4 (serving stress)
          artifact-search-root: ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving
          artifact-path-globs: |
            */benchmark/results.json
            */benchmark/manifest.json
            */benchmark.wall_time.json
          artifact-upload-name: tts-stage-serving-results
          artifact-upload-path: ${{ env.OMNI_CI_HOME }}/tts-stage-results/serving
          artifact-if-no-files-found: error
          summary-only: "true"
