[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "deny"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
deny = [
  { name = "git2", reason = "Git dependencies and libgit2 are outside the router trust boundary" },
  { name = "libgit2-sys", reason = "Native libgit2 is outside the router trust boundary" },
  { name = "native-tls", reason = "Isolated HTTPS health uses the reviewed rustls stack" },
  { name = "openssl", reason = "Isolated HTTPS health uses the reviewed rustls stack" },
  { name = "openssl-sys", reason = "Native OpenSSL is outside the router trust boundary" },
]
skip = [
  { name = "getrandom", version = "=0.3.4", reason = "tungstenite 0.29 uses rand 0.9 for client handshake keys; ring retains getrandom 0.2.17" },
  { name = "webpki-roots", version = "=0.26.11", reason = "tokio-tungstenite 0.29 pins the compatibility wrapper over the reqwest TLS graph's webpki-roots 1.0.8" },
  { name = "windows-sys", version = "=0.52.0", reason = "ring 0.17.14 pins this target-only line; Tokio and Criterion use 0.61.2" },
]
skip-tree = []

[[bans.features]]
name = "tokio"
deny = ["fs", "full", "io-std", "io-uring", "parking_lot", "process", "taskdump"]

[[bans.features]]
name = "axum"
deny = ["default", "form", "http2", "json", "macros", "multipart"]

[[bans.features]]
name = "clap"
deny = ["cargo", "color", "default", "deprecated", "env", "suggestions", "unicode", "wrap_help"]

[[bans.features]]
name = "toml"
deny = ["debug", "default", "display", "fast_hash", "preserve_order", "unbounded"]

[[bans.features]]
name = "tracing"
deny = ["attributes", "default", "log", "log-always", "valuable"]

[[bans.features]]
name = "tracing-subscriber"
deny = ["ansi", "chrono", "default", "local-time", "parking_lot", "smallvec", "tracing-log", "valuable"]

[[bans.features]]
name = "tokio-util"
deny = ["codec", "compat", "full", "io", "io-util", "join-map", "net", "time"]

[bans.build]
executables = "deny"
interpreted = "deny"
include-dependencies = true
include-workspace = true
include-archives = true
allow-build-scripts = [
  { name = "httparse", version = "=1.10.1" },
  { name = "libc", version = "=0.2.186" },
  { name = "crunchy", version = "=0.2.4" },
  { name = "generic-array", version = "=0.14.7" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "icu_normalizer_data", version = "=2.2.0" },
  { name = "icu_properties_data", version = "=2.2.0" },
  { name = "num-traits", version = "=0.2.19" },
  { name = "proc-macro2", version = "=1.0.106" },
  { name = "quote", version = "=1.0.46" },
  { name = "ring", version = "=0.17.14" },
  { name = "rustls", version = "=0.23.42" },
  { name = "rustversion", version = "=1.0.23" },
  { name = "serde", version = "=1.0.228" },
  { name = "serde_core", version = "=1.0.228" },
  { name = "serde_json", version = "=1.0.150" },
  { name = "thiserror", version = "=2.0.18" },
  { name = "valuable", version = "=0.1.1" },
  { name = "wasm-bindgen", version = "=0.2.126" },
  { name = "wasm-bindgen-shared", version = "=0.2.126" },
  { name = "wit-bindgen", version = "=0.57.1" },
  { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
  { name = "windows_aarch64_msvc", version = "=0.52.6" },
  { name = "windows_i686_gnu", version = "=0.52.6" },
  { name = "windows_i686_gnullvm", version = "=0.52.6" },
  { name = "windows_i686_msvc", version = "=0.52.6" },
  { name = "windows_x86_64_gnu", version = "=0.52.6" },
  { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
  { name = "windows_x86_64_msvc", version = "=0.52.6" },
  { name = "zerocopy", version = "=0.8.54" },
  { name = "zmij", version = "=1.0.23" },
]

[[bans.build.bypass]]
name = "untrusted"
version = "=0.9.0"
allow-globs = [
  "mk/cargo.sh",
  "mk/install-build-tools.sh",
  "mk/runner",
]

