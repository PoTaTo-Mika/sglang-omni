[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "deny"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
deny = [
  { name = "git2", reason = "Git dependencies and libgit2 are outside the PR1 trust boundary" },
  { name = "libgit2-sys", reason = "Native libgit2 is outside the PR1 trust boundary" },
  { name = "native-tls", reason = "Use rustls if TLS enters a later reviewed branch" },
  { name = "openssl", reason = "Use rustls if TLS enters a later reviewed branch" },
  { name = "openssl-sys", reason = "Native OpenSSL is outside the PR1 trust boundary" },
]
skip = []
skip-tree = []

[[bans.features]]
name = "tokio"
deny = ["fs", "full", "io-std", "io-util", "io-uring", "parking_lot", "process", "taskdump"]

[[bans.features]]
name = "axum"
deny = ["default", "form", "http2", "json", "macros", "multipart", "query", "ws"]

[[bans.features]]
name = "clap"
deny = ["cargo", "color", "default", "deprecated", "env", "suggestions", "unicode", "wrap_help"]

[[bans.features]]
name = "toml"
deny = ["debug", "default", "display", "fast_hash", "preserve_order", "unbounded"]

[[bans.features]]
name = "tracing"
deny = ["attributes", "default", "log", "log-always", "valuable"]

[[bans.features]]
name = "tracing-subscriber"
deny = ["ansi", "chrono", "default", "local-time", "parking_lot", "smallvec", "tracing-log", "valuable"]

[[bans.features]]
name = "tokio-util"
deny = ["codec", "compat", "full", "io", "io-util", "join-map", "net", "time"]

[bans.build]
executables = "deny"
interpreted = "deny"
include-dependencies = true
include-workspace = true
include-archives = true
allow-build-scripts = [
  { name = "httparse", version = "=1.10.1" },
  { name = "libc", version = "=0.2.186" },
  { name = "proc-macro2", version = "=1.0.106" },
  { name = "quote", version = "=1.0.46" },
  { name = "serde", version = "=1.0.228" },
  { name = "serde_core", version = "=1.0.228" },
  { name = "serde_json", version = "=1.0.150" },
  { name = "thiserror", version = "=2.0.18" },
  { name = "valuable", version = "=0.1.1" },
  { name = "zmij", version = "=1.0.23" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = []
