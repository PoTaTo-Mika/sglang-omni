# Complete text-generation example. The capacity values are deployment choices,
# not measured hardware recommendations; tune them against the target workload.
schema_version = 1

[server]
listen = "127.0.0.1:30000"
max_connections = 1024

[shutdown]
drain_timeout_ms = 30000

[logging]
format = "pretty"
filter = "info"

[router]
strategy = "round_robin"
required_services = ["generation_http"]
max_concurrent_classifications = 4

[admission]
global = 64
generation_http = 64
speech_http = 1
transcription_http = 1
speech_batch = 1
speech_websocket = 1
realtime_websocket = 1
control = 1

[health]
interval_ms = 5000
timeout_ms = 1000
success_threshold = 2
failure_threshold = 3
max_concurrent_probes = 16

[http_generation]
trust_domain = "local"
buffered_request_max_bytes = 8388608
buffered_request_total_bytes = 268435456
streamed_request_max_bytes = 536870912
connect_timeout_ms = 5000
request_timeout_ms = 1800000
pool_idle_timeout_ms = 90000
pool_max_idle_per_host = 8

[[workers]]
worker_id = "omni-a"
base_url = "http://127.0.0.1:8000"
trust_domain = "local"
default_model_id = "qwen3-omni"
health_path = "/health"

[workers.capacity]
generation_http = 64

[[workers.service_profiles]]
service = "generation_http"
model_ids = ["qwen3-omni"]
message_content_forms = ["string"]
media_placements = []
input_modalities = ["text"]
output_modalities = ["text"]
chat_audio_formats = []
stream_modes = ["non_streaming", "streaming"]
